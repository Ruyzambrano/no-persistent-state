<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>No Persistent State</title>
        <meta name="description" content="Live BGP routing updates from RIPE NCC's RIS Live feed, drawn as fading brushstrokes with optional generative sound.">

        <meta property="og:type" content="website">
        <meta property="og:url" content="https://ruyzambrano.github.io/no-persistent-state/">
        <meta property="og:title" content="No Persistent State">
        <meta property="og:description" content="The internet, dreaming. Live BGP routing updates drawn as fading brushstrokes.">
        <meta property="og:image" content="https://ruyzambrano.github.io/no-persistent-state/preview.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="Coloured curved strokes fading on a black canvas">
        <meta name="twitter:card" content="summary_large_image">

        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <div class="header">
            <div class="title-card">
                <h1>No Persistent State</h1>
                <p>A nervous system without body</p>
                <p>Breath without lungs</p>
                <p>The internet, dreaming</p>
            </div>
            <div class="controls">
                <div class="visuals">
                    <div class="speed">
                        <input type="range" id="speed-sample" min="0" max="100" value="75">
                        <label for="speed-sample">Speed of Sample</label>
                    </div>
                    <div class="collector">
                        <label for="collector">Collector: </label>
                        <select id="collector">
                            <option value="rrc01" selected>London</option>
                            <option value="rrc21">Paris</option>
                            <option value="rrc11">New York</option>
                            <option value="rrc15">São Paulo</option>
                            <option value="rrc19">Johannesburg</option>
                            <option value="rrc26">Dubai</option>
                            <option value="rrc06">Tokyo</option>
                            <option value="rrc23">Singapore</option>
                            <option value="rrc00">Global</option>
                        </select>
                    </div>
                    <div class="mode">
                        <div class="light-button">
                            <input type="radio" name="Mode" id="light" value="light"/>
                            <label for="light">Light</label>
                        </div>
                        <div class="dark-button">
                            <input type="radio" name="Mode" id="dark" value="dark" checked/>
                            <label for="dark">Dark</label>
                        </div>
                    </div>
                    <button type="button" id="clear-canvas">Clear canvas</button>
                    <button type="button" id="display-mode" title="Hide controls and go fullscreen. Press F or Esc to exit.">Full Screen (F)</button>
                </div>
                <div class="sound">
                    <div class="play-sound">
                        <input type="checkbox" name="Play sound" id="sound">
                        <label for="sound">Play sound</label>
                    </div>
                    <div class="select-modal-scale">
                        <label for="scale-mode">Modal Scale: </label>
                        <select id="scale-mode">
                            <option value="ionian">Ionian</option>
                            <option value="dorian">Dorian</option>
                            <option value="phrygian" selected>Phrygian</option>
                            <option value="lydian">Lydian</option>
                            <option value="mixolydian">Mixolydian</option>
                            <option value="aeolian">Aeolian</option>
                            <option value="locrian">Locrian</option>
                        </select>
                    </div>
                    <div class="follow-pitch">
                        <input type="radio" name="PitchMode" id="follow-pitch" value="follow"/>
                        <label for="follow-pitch">Follow pitch</label>
                    </div>
                    <div class="fixed-pitch">
                        <input type="radio" name="PitchMode" id="fixed-pitch" value="fixed" checked/>
                        <label for="fixed-pitch">Fixed pitch</label>
                    </div>
                </div>

            </div>
        </div>
        <canvas id="canvas-drawing"></canvas>
        <script type="module" src="./src/main.js"></script>
        <div class="github-link">
            <a href="https://www.github.com/ruyzambrano/no-persistent-state">View on Github</a>
        </div>
    </body>
</html>
